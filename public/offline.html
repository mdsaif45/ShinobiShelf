<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · Circle</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f2ed;
        color: #2c2c2c;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 380px;
        text-align: center;
      }
      .mark {
        font-family: ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif;
        font-style: italic;
        font-weight: 600;
        font-size: 44px;
        color: #4b5320;
        margin-bottom: 20px;
      }
      h1 {
        font-family: ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif;
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 10px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #6b6b6b;
        margin: 0 0 24px;
      }
      button {
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        color: #fff;
        background: #4b5320;
        border: 0;
        border-radius: 12px;
        padding: 10px 22px;
        cursor: pointer;
      }
      button:hover { background: #3d441a; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">C</div>
      <h1>You're offline</h1>
      <p>
        Circle needs a connection to load your shelf. Your books are safe — reconnect
        and they'll be right where you left them.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
